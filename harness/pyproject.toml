[project]
name = "text-sql-harness"
version = "0.1.0"
description = "Analyst agent harness: text-to-SQL, dashboards, and governed query execution."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
dev = ["pytest>=8.0"]

[project.scripts]
tsql = "tsql.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tsql*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
